<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1722"><title>C5-OBD</title>
<style>
:root{--bg:#e8ecf1;--card:#fff;--fg:#121c2a;--mut:#617286;--line:#d2d9e2;--acc:#1f4fd8;--accfg:#fff;--warn:#b45309;--bad:#c0262d;--ok:#15803d;--arc:#d9e0e8;--red:#d9382f}
:root[data-t=dark]{--bg:#0b1119;--card:#151e2b;--fg:#e7eef6;--mut:#8b9db2;--line:#243142;--acc:#6b95ff;--accfg:#0b1426;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80;--arc:#243142;--red:#ff6b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em}
.chip{display:flex;align-items:center;gap:7px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--mut);max-width:58%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.dot.c{background:var(--warn)}.dot.on{background:var(--ok);animation:pu 2s ease-out infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;min-height:44px;transition:transform .12s,background .2s}
button:active{transform:scale(.96)}button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
button.d{color:var(--bad);border-color:var(--bad)}button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ib{padding:0;width:44px;display:grid;place-items:center}.ib svg,nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;padding:4px 14px 16px;position:relative}
.pg{display:none}.pg.on{display:block;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px}
.gauge{position:relative;padding:6px 10px 12px}
.gauge svg{width:100%;display:block;max-height:46vh}
.gauge .sp{position:absolute;left:0;right:0;bottom:14px;text-align:center}
.sp b{font-size:44px;font-weight:800;line-height:1}.sp small{color:var(--mut);margin-left:3px}
.gear{position:absolute;top:10px;right:14px;text-align:center;color:var(--mut);font-size:12px}
.gear b{display:block;font-size:30px;color:var(--fg);line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;position:relative;overflow:hidden}
.t small{color:var(--mut);display:block}.t b{font-size:24px}.t em{font-style:normal;color:var(--mut);font-size:13px;margin-left:3px}
.t i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width .4s,background .3s}
.t.w b{color:var(--warn)}.t.w i{background:var(--warn)}.t.x b{color:var(--bad)}.t.x i{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>button{flex:1}
.note{color:var(--mut);font-size:13px}
.dtc{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);animation:in .3s both}.dtc:first-of-type{border-top:0}
.dtc b{font-size:19px;color:var(--bad);min-width:68px}.dtc div{font-size:14px}.dtc small{display:block;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--bg);border-radius:12px;padding:8px 10px}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:18px}
canvas{width:100%;height:110px;display:block}.leg{font-size:12px;color:var(--mut);margin:6px 0 2px}
#log{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;height:48vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
#log i{color:var(--acc);font-style:normal}
.cmd{display:flex;gap:8px;margin-top:8px}.cmd input,.set select,.set input[type=number]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}.cmd input{flex:1;text-transform:uppercase}
nav{position:relative;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:6px 0;transition:color .2s}
nav button.on{color:var(--acc);font-weight:700}
#ind{position:absolute;top:0;left:0;height:3px;width:25%;background:var(--acc);border-radius:0 0 4px 4px;transition:transform .3s cubic-bezier(.3,.9,.3,1)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility .3s}
#sheet.on{visibility:visible}
#sheet .bg{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .3s}#sheet.on .bg{opacity:1}
#sheet .box{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
#sheet.on .box{transform:none}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.set:first-of-type{border-top:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>
 <h1>C5-OBD</h1>
 <div class="chip" id="chip"><i class="dot" id="dot"></i><span id="st">Bağlı değil</span></div>
 <button class="ib" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</header>
<main>
<section class="pg on">
 <div class="card gauge">
  <svg viewBox="0 0 200 175" aria-label="Devir göstergesi" id="g"><path id="a0" d="M43.43 156.57A80 80 0 1 1 156.57 156.57" fill="none" stroke="var(--arc)" stroke-width="13" stroke-linecap="round" pathLength="100"/>
   <path id="ar" d="M43.43 156.57A80 80 0 1 1 156.57 156.57" fill="none" stroke="var(--red)" stroke-width="13" pathLength="100" opacity=".9"/>
   <path id="a1" d="M43.43 156.57A80 80 0 1 1 156.57 156.57" fill="none" stroke="var(--acc)" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
   <g id="ticks"></g>
   <text id="rpm" x="100" y="108" text-anchor="middle" font-size="36" font-weight="800" fill="var(--fg)">–</text>
   <text x="100" y="124" text-anchor="middle" font-size="10" fill="var(--mut)">devir/dk</text></svg>
  <div class="gear"><b id="gear">–</b>vites</div>
  <div class="sp"><b id="spd">–</b><small>km/s</small></div>
 </div>
 <div class="tiles" id="tiles"></div>
 <div class="row"><button class="p" id="bGo" disabled>Canlı veriyi başlat</button><button id="bStop" disabled>Durdur</button></div>
 <p class="note">Canlı veri araca OBD-II sorgusu gönderir. 3 sn cevap gelmezse cihaz sorguyu kendiliğinden durdurur.</p>
</section>
<section class="pg">
 <div class="card"><h2>Arıza kodları</h2>
  <div class="row" style="margin-top:0"><button class="p" id="bDtc" disabled>Kodları oku</button><button id="bVin" disabled>VIN oku</button></div>
  <div id="dtcs" class="note">Henüz okunmadı.</div><div id="vin" class="note" style="margin-top:8px"></div>
  <div class="row"><button class="d" id="bClr" disabled>Kodları sil</button></div></div>
</section>
<section class="pg">
 <div class="card"><h2>Bu sürüş</h2><div class="stats" id="stats"></div></div>
 <div class="card"><h2>Devir</h2><canvas id="c0"></canvas><h2 style="margin-top:14px">Hız</h2><canvas id="c1"></canvas><h2 style="margin-top:14px">Soğutma suyu</h2><canvas id="c2"></canvas>
  <div class="row"><button id="bReset">Sürüşü sıfırla</button></div></div>
</section>
<section class="pg">
 <div id="log"></div>
 <div class="cmd"><input id="ci" placeholder="PING, STATUS, SUP, Q 010C" autocapitalize="characters"><button class="p" id="bSend">Gönder</button></div>
</section>
</main>
<nav id="nav"><i id="ind"></i>
 <button class="on"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1116 0"/><path d="M12 16l4-5"/></svg>Canlı</button>
 <button><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>Arızalar</button>
 <button><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M11 16V5M16 16v-4M21 16V8" /></svg>Sürüş</button>
 <button><svg viewBox="0 0 24 24"><path d="M4 6l6 6-6 6M12 19h8"/></svg>Konsol</button>
</nav>
<div id="toast"></div>
<div id="sheet"><div class="bg"></div><div class="box">
 <h2 style="margin:0 0 6px">Ayarlar</h2>
 <div class="set"><span>Bağlan / kes</span><button class="p" id="bBle">Cihaza bağlan</button></div>
 <div class="set"><span>Demo modu</span><button id="bDemo">Başlat</button></div>
 <div class="set"><span>Tema</span><select id="sTheme"><option value="auto">Otomatik</option><option value="light">Açık</option><option value="dark">Koyu</option></select></div>
 <div class="set"><span>Sorgu aralığı (ms)</span><select id="sMs"><option>100</option><option>150</option><option>250</option><option>400</option></select></div>
 <div class="set"><span>Kırmızı bölge (devir)</span><input type="number" id="sRed" step="100" min="4000" max="8000" style="width:100px"></div>
 <div class="set"><span>Ekranı açık tut</span><input type="checkbox" id="sWake"></div>
 <div class="row"><button id="bClose">Kapat</button></div>
</div></div>
<script src="ble.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const CFG=Object.assign({theme:'auto',ms:150,red:6000,wake:false},JSON.parse(localStorage.getItem('c5cfg')||'{}'));
const save=()=>localStorage.setItem('c5cfg',JSON.stringify(CFG));
function theme(){const d=CFG.theme=='auto'?matchMedia('(prefers-color-scheme:dark)').matches:CFG.theme=='dark';document.documentElement.dataset.t=d?'dark':'light';}
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
const buzz=()=>navigator.vibrate&&navigator.vibrate(12);
// PID: [ad, birim, çözücü, uyarı, ölçek max]
const P={0x0C:['Devir','',(a,b)=>(a*256+b)/4],0x0D:['Hız','',a=>a],
 0x05:['Soğutma suyu','°C',a=>a-40,v=>v>108?2:v>100?1:0,130],0x0F:['Emme havası','°C',a=>a-40,null,80],
 0x11:['Gaz kelebeği','%',a=>a*100/255,null,100],0x04:['Motor yükü','%',a=>a*100/255,null,100],
 0x10:['MAF','g/s',(a,b)=>(a*256+b)/100,null,60],0x0B:['MAP','kPa',a=>a,null,110],
 0x42:['Akü gerilimi','V',(a,b)=>(a*256+b)/1000,v=>v<11.8?2:v<12.3?1:0,15],
 0x2F:['Yakıt seviyesi','%',a=>a*100/255,v=>v<10?2:v<20?1:0,100]};
const TILES=[5,15,17,4,16,11,66,47];
$('#tiles').innerHTML=TILES.map(p=>`<div class="t" id="t${p}"><small>${P[p][0]}</small><b>–</b><em>${P[p][1]}</em><i></i></div>`).join('');
// kadran çizgileri
(()=>{let h='';for(let k=0;k<=8;k++){const a=(135+270*k/8)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
 h+=`<line x1="${100+c*66}" y1="${100+s*66}" x2="${100+c*72}" y2="${100+s*72}" stroke="var(--mut)" stroke-width="1.5"/><text x="${100+c*55}" y="${100+s*55+3}" text-anchor="middle" font-size="8" fill="var(--mut)">${k}</text>`;}
 $('#ticks').innerHTML=h;})();
function redline(){const r=CFG.red/8000*100;$('#ar').setAttribute('stroke-dasharray',`${100-r} 100`);$('#ar').setAttribute('stroke-dashoffset',-r);}
// değerler ve yumuşak animasyon
const vals={},cur={rpm:0,spd:0};let tgt={rpm:0,spd:0};
function frame(){for(const k in cur){cur[k]+=(tgt[k]-cur[k])*.18;if(Math.abs(tgt[k]-cur[k])<.3)cur[k]=tgt[k];}
 if(vals[12]!=null){$('#rpm').textContent=Math.round(cur.rpm);$('#a1').setAttribute('stroke-dasharray',Math.min(100,cur.rpm/80)+' 100');
  $('#a1').setAttribute('stroke',cur.rpm>CFG.red?'var(--red)':'var(--acc)');}
 if(vals[13]!=null)$('#spd').textContent=Math.round(cur.spd);
 requestAnimationFrame(frame);}requestAnimationFrame(frame);
// sürüş verisi
let trip,H;function resetTrip(){trip={t0:0,last:0,dist:0,maxV:0,maxR:0,sumV:0,n:0};H={12:[],13:[],5:[]};}resetTrip();
function stats(){const el=trip.t0?(Date.now()-trip.t0)/60000:0;
 const it=[['Süre',el.toFixed(0)+' dk'],['Mesafe',trip.dist.toFixed(1)+' km'],['Ort. hız',(trip.n?trip.sumV/trip.n:0).toFixed(0)+' km/s'],
  ['En yüksek hız',trip.maxV.toFixed(0)],['En yüksek devir',trip.maxR.toFixed(0)],['Su sıc.',vals[5]!=null?vals[5].toFixed(0)+' °C':'–']];
 $('#stats').innerHTML=it.map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');}
function spark(c,a,col,max){const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio,x=c.getContext('2d');
 x.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement);x.strokeStyle=cs.getPropertyValue('--line');x.lineWidth=1;
 for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke();}
 if(a.length<2)return;x.strokeStyle=cs.getPropertyValue(col);x.lineWidth=2.5*devicePixelRatio;x.lineJoin='round';x.beginPath();
 a.forEach((v,i)=>{const px=i/(a.length-1)*w,py=h-Math.min(1,v/max)*(h-6)-3;i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();}
function charts(){spark($('#c0'),H[12],'--acc',8000);spark($('#c1'),H[13],'--ok',200);spark($('#c2'),H[5],'--warn',130);stats();}
setInterval(()=>{if($$('.pg')[2].classList.contains('on'))charts();},1000);
function setPid(pid,b){const d=P[pid];if(!d)return;const v=d[2](b[0]||0,b[1]||0);vals[pid]=v;const now=Date.now();
 if(!trip.t0)trip.t0=now;
 if(pid==12){tgt.rpm=v;trip.maxR=Math.max(trip.maxR,v);}
 else if(pid==13){tgt.spd=v;trip.maxV=Math.max(trip.maxV,v);trip.sumV+=v;trip.n++;if(trip.last)trip.dist+=v*(now-trip.last)/3.6e6;trip.last=now;}
 if(H[pid]){const a=H[pid];if(!a._t||now-a._t>1000){a._t=now;a.push(v);if(a.length>300)a.shift();}}
 const t=$('#t'+pid);if(t){const lv=d[3]?d[3](v):0;t.querySelector('b').textContent=v.toFixed(pid==66||pid==16?1:0);
  t.className='t'+(lv?(lv==2?' x':' w'):'');t.querySelector('i').style.width=Math.min(100,v/d[4]*100)+'%';}
 if(vals[12]>0&&vals[13]>3){const r=vals[12]/vals[13],g=[[120,1],[70,2],[48,3],[36,4],[28,5]];
  $('#gear').textContent=g.reduce((m,x)=>Math.abs(x[0]-r)<Math.abs(m[0]-r)?x:m)[1];}}
// günlük ve satır ayrıştırma
function log(s,tx){const l=$('#log');l.insertAdjacentHTML('beforeend',(tx?'<i>> ':'')+s.replace(/</g,'&lt;')+(tx?'</i>':'')+'\n');
 if(l.childNodes.length>600)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight;}
const DESC={P0300:'Rastgele / çoklu silindir tekleme',P0301:'1. silindir tekleme',P0302:'2. silindir tekleme',P0303:'3. silindir tekleme',P0304:'4. silindir tekleme',
 P0420:'Katalizör verimi eşiğin altında',P0171:'Karışım fakir (bank 1)',P0172:'Karışım zengin (bank 1)',P0130:'O2 sensörü devresi',P0135:'O2 sensörü ısıtıcı devresi',
 P0113:'Emme havası sıcaklık sensörü yüksek',P0118:'Soğutma suyu sensörü yüksek',P0335:'Krank sensörü devresi',P0562:'Sistem gerilimi düşük',P0505:'Rölanti kontrol sistemi'};
let dtcRows=[];
function line(s){s=s.trim();if(!s)return;log(s);const f=s.split(',');
 if(f[0]=='D'&&f.length>=4){const pid=parseInt(f[2],16),h=f[3].replace(/\s/g,''),b=[];for(let i=0;i+1<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));setPid(pid,b);}
 else if(f[0]=='DTC'){const c=f.slice(3).join(' ').split(/[\s;]+/).filter(x=>/^[PCBU][0-9A-F]{4}$/i.test(x));dtcRows.push(...c.map(x=>({c:x.toUpperCase(),ecu:f[2]})));}
 else if(f[0]=='DTCEND'){const e=$('#dtcs');e.className='';e.innerHTML=dtcRows.length?dtcRows.map((r,i)=>`<div class="dtc" style="animation-delay:${i*70}ms"><b>${r.c}</b><div>${DESC[r.c]||'Açıklama listede yok'}<small>Kontrol birimi ${r.ecu}</small></div></div>`).join(''):'<span class="note">Kayıtlı arıza kodu yok.</span>';
  toast(dtcRows.length?dtcRows.length+' arıza kodu bulundu':'Arıza kodu yok');dtcRows=[];buzz();}
 else if(f[0]=='VIN')$('#vin').textContent='VIN: '+f[2];
 else if(f[0]=='ST')status('on','Bağlı · CAN '+f[2]);
 else if(s.startsWith('OK PONG'))status('on',s.slice(3));
 else if(s.startsWith('ERR')){toast(s);}}
function status(k,t){$('#dot').className='dot '+(k||'');$('#st').textContent=t;}
// bağlantı
let ch=null,dev=null,buf='',demoT=null,native=null,wl=null;
const enc=new TextEncoder(),dec=new TextDecoder();
const feed=t=>{buf+=t;let i;while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i));buf=buf.slice(i+1);}};
async function send(c){log(c,1);if(demoT){demoCmd(c);return;}if(native){await NativeBle.write(native.id,c+'\n');return;}if(!ch)return;
 const b=enc.encode(c+'\n');for(let i=0;i<b.length;i+=20)await ch.writeValueWithoutResponse(b.slice(i,i+20));}
function ui(on){['bGo','bStop','bDtc','bVin','bClr'].forEach(i=>$('#'+i).disabled=!on);}
function lost(){native=null;ch=null;ui(false);$('#bBle').textContent='Cihaza bağlan';status('','Bağlantı koptu');toast('Bağlantı koptu');}
async function keepAwake(){try{if(CFG.wake&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function connected(n){$('#bBle').textContent='Bağlantıyı kes';ui(true);status('on','Bağlandı: '+n);toast('Bağlandı');buzz();keepAwake();closeSheet();send('PING');}
$('#bBle').onclick=async()=>{
 if(native){NativeBle.disconnect(native.id);return;}if(ch){dev.gatt.disconnect();return;}
 status('c','Bağlanıyor…');
 if(window.NativeBle){try{native=await NativeBle.connect(feed,lost);connected(native.name||'C5-OBD');}catch(e){native=null;status('','Bağlanamadı');toast('Bağlanamadı: '+(e.message||e));}return;}
 if(!navigator.bluetooth){status('','Web Bluetooth yok');toast('Bu tarayıcı Web Bluetooth desteklemiyor. Android Chrome kullan.');return;}
 try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'C5'},{services:[NUS]}],optionalServices:[NUS]});
  dev.addEventListener('gattserverdisconnected',lost);const sv=await dev.gatt.connect(),s=await sv.getPrimaryService(NUS),tx=await s.getCharacteristic(TXC);
  ch=await s.getCharacteristic(RXC);await tx.startNotifications();tx.addEventListener('characteristicvaluechanged',e=>feed(dec.decode(e.target.value)));connected(dev.name);
 }catch(e){status('','Bağlanamadı');toast('Bağlanamadı: '+e.message);}};
const poll=()=>send(`POLL ${CFG.ms} 0C,0D,05:10,0F:10,11,04,10:5,0B:5,42:20,2F:50`);
$('#bGo').onclick=()=>{poll();toast('Canlı veri başladı');buzz();};
$('#bStop').onclick=()=>{send('STOP');toast('Durduruldu');};
$('#bDtc').onclick=()=>{dtcRows=[];$('#dtcs').textContent='Okunuyor…';send('DTC');};
$('#bVin').onclick=()=>send('VIN');
$('#bClr').onclick=()=>{if(confirm('Arıza kodları ve donmuş kare verisi silinecek. Devam edilsin mi?'))send('CLR');};
$('#bSend').onclick=()=>{const v=$('#ci').value.trim();if(v){send(v);$('#ci').value='';}};
$('#ci').onkeydown=e=>{if(e.key=='Enter')$('#bSend').click();};
$('#bReset').onclick=()=>{resetTrip();charts();toast('Sürüş sıfırlandı');};
// menü
function go(i){$$('#nav button').forEach((b,j)=>b.classList.toggle('on',i==j));$$('.pg').forEach((p,j)=>p.classList.toggle('on',i==j));
 $('#ind').style.transform=`translateX(${i*100}%)`;$('main').scrollTop=0;if(i==2)charts();buzz();}
$$('#nav button').forEach((b,i)=>b.onclick=()=>go(i));
let sx=0;$('main').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('main').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,i=$$('.pg').findIndex(p=>p.classList.contains('on'));
 if(Math.abs(dx)>90&&e.target.id!='log'&&!e.target.closest('canvas')){const n=i+(dx<0?1:-1);if(n>=0&&n<4)go(n);}},{passive:true});
function closeSheet(){$('#sheet').classList.remove('on');}
$('#bSet').onclick=()=>$('#sheet').classList.add('on');$('#bClose').onclick=closeSheet;$('#sheet .bg').onclick=closeSheet;
$('#sTheme').value=CFG.theme;$('#sMs').value=CFG.ms;$('#sRed').value=CFG.red;$('#sWake').checked=CFG.wake;redline();
$('#sTheme').onchange=e=>{CFG.theme=e.target.value;save();theme();};
$('#sMs').onchange=e=>{CFG.ms=+e.target.value;save();toast('Sonraki başlatmada geçerli');};
$('#sRed').onchange=e=>{CFG.red=Math.min(8000,Math.max(4000,+e.target.value||6000));save();redline();};
$('#sWake').onchange=e=>{CFG.wake=e.target.checked;save();if(CFG.wake)keepAwake();else if(wl){wl.release();wl=null;}};
// demo
function demoCmd(c){c=c.toUpperCase();
 if(c=='DTC')setTimeout(()=>{line('DTC,03,7E8,P0303 P0420');line('DTCEND');},500);
 else if(c=='VIN')setTimeout(()=>line('VIN,7E8,VF7SC9HXC00000000'),400);
 else if(c=='PING')line('OK PONG C5-OBD DEMO');
 else if(c.startsWith('POLL'))runDemo();else if(c=='STOP'){clearInterval(demoT._i);demoT._i=0;}}
const hx=(n,l)=>Math.round(n).toString(16).padStart(l,'0').toUpperCase();
function runDemo(){let t=0;clearInterval(demoT._i);
 demoT._i=setInterval(()=>{t+=.15;const sp=70+45*Math.sin(t/4),r4=Math.round((1900+1200*Math.sin(t/4)+80*Math.sin(t*5))*4);
  [['0C',hx(r4>>8,2)+hx(r4&255,2)],['0D',hx(sp,2)],['05',hx(130,2)],['0F',hx(95,2)],['11',hx(60+20*Math.sin(t/4),2)],['04',hx(90,2)],
   ['10',hx(900+300*Math.sin(t/4),4)],['0B',hx(45,2)],['42',hx(14100,4)],['2F',hx(150,2)]].forEach(([p,h])=>line(`D,${Math.round(t*1000)},${p},${h}`));},150);}
$('#bDemo').onclick=()=>{demoT={};ui(true);status('on','Demo modu');closeSheet();poll();};
</script></body></html>
